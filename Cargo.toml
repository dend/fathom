[package]
name = "fathom"
version = "0.0.1"
description = "High performance Cloudflare R2 storage manager"
authors = ["Den"]
license = "MIT"
repository = "https://github.com/dend/fathom"
edition = "2021"
rust-version = "1.90"
publish = false
default-run = "fathom"

[lib]
name = "fathom"
path = "src/lib.rs"

[[bin]]
name = "fathom"
path = "src/main.rs"

[[bin]]
name = "fth"
path = "src/bin/fth.rs"

[dependencies]
# Window, input and GPU rendering (Metal, DirectX 12 or Vulkan through wgpu).
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
    "clipboard",
    "persistence",
    # Falls back to installed fonts for scripts the UI font lacks (CJK, Arabic, ...),
    # since object keys can contain anything.
    "system_fonts",
    "wayland",
    "x11",
] }
# Native open/save/folder pickers.
rfd = "0.18"
# Decoding images for previews. Only the formats R2 users commonly store.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Config (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP client with rustls. The S3 protocol on top of it is hand-rolled.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# SHA-256 for SigV4 request signing (HMAC is implemented on top of it).
sha2 = "0.10"
# The command line tool's --regex patterns, and the globs it translates into them.
regex = "1"
# Account details live in the OS credential store, never on disk in plain text.
keyring ={ version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# Local time and the default app for a file type.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# Local time.
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
# Embeds the app icon and version info in the Windows executable.
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The macOS and Linux packages are built with cargo-packager (a build tool, not a
# dependency). The Windows installer is built with Inno Setup from installer/fathom.iss.
#   cargo install cargo-packager --locked
#   cargo build --release && cargo packager --release
[package.metadata.packager]
product-name = "Fathom"
identifier = "dev.den.fathom"
publisher = "Den"
copyright = "Copyright (c) Den"
category = "Utility"
description = "A file explorer for Cloudflare R2."
long-description = "Browse buckets, upload and download in bulk, preview files and copy public URLs."
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
binaries = [{ path = "fathom", main = true }, { path = "fth", main = false }]

[package.metadata.packager.macos]
minimum-system-version = "10.15"
signing-identity = "-"

[package.metadata.packager.deb]
section = "utils"
