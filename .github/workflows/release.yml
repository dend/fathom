name: Release

# Pushing a version tag such as 0.2.0 builds Fathom for every platform and publishes
# a GitHub release. The tag is the version: it is written into the build, so
# Cargo.toml doesn't need a bump. A tag with a suffix (0.2.0-beta.1) is published as
# a pre-release. Running the workflow by hand from the Actions tab builds the same
# files as workflow artifacts, versioned from Cargo.toml, without publishing.
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev.$GITHUB_RUN_NUMBER"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Building Fathom $version"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the version into the build
        shell: bash
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "fathom"\r?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: release-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-windows-

      - name: Build
        run: cargo build --release --locked

      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, portable | Out-Null
          Copy-Item target/release/fathom.exe, target/release/fth.exe portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "dist/fathom-$env:VERSION-windows-x64-portable.zip"

      # A pinned, checksum-verified Inno Setup, installed for the runner's user only.
      # The script needs 6.6 or later for dark mode and .png wizard images.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") {
            throw "Inno Setup download has an unexpected checksum: $hash"
          }
          Start-Process $installer -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno"

      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\target\release\fathom.exe" "/DSourceCliExe=$PWD\target\release\fth.exe" "/O$PWD\dist" installer\fathom.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: fathom-windows-x64
          path: dist/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
            label: macos-arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
            label: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            label: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Write the version into the build
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          perl -0pi -e 's/(name = "fathom"\r?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config file

      - name: Update Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager*
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Install cargo-packager
        run: command -v cargo-packager >/dev/null || cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Collect the packages
        run: |
          mkdir dist
          for file in target/${{ matrix.target }}/release/*.{dmg,deb,AppImage}; do
            [ -e "$file" ] || continue
            cp "$file" "dist/fathom-$VERSION-${{ matrix.label }}.${file##*.}"
          done
          ls -l dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: fathom-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Fathom $VERSION" --generate-notes "${flags[@]}"
